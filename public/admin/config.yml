backend:
  name: github
  repo: hyukjin-lee/hyukjin-lee.github.io
  branch: main
  # Sveltia CMS의 OAuth 프록시 사용 (GitHub OAuth App 필요)
  base_url: https://api.sveltia.app
  auth_endpoint: auth
  client_id: Ov23liFrCGY7xUPprh3E

locale: ko

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: life
    label: "Life"
    label_singular: "Life 글"
    folder: _posts/life
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    preview_path: "life/{{year}}/{{month}}/{{day}}/{{fields.slug}}"
    summary: "{{title}} ({{date}})"
    sort_field: date
    sort_direction: Descending
    fields:
      - label: "제목"
        name: title
        widget: string
      - label: "날짜"
        name: date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: "{{now}}"
      - label: "수정일"
        name: updatedAt
        widget: datetime
        default: "{{now}}"
      - label: "Slug"
        name: slug
        widget: string
        hint: "영문 소문자와 하이픈만 사용 (예: my-new-post)"
        pattern: ['^[a-z0-9-]+$', "영문 소문자, 숫자, 하이픈만 허용"]
      - label: "카테고리"
        name: category
        widget: hidden
        default: life
      - label: "내용"
        name: body
        widget: markdown

  - name: work
    label: "Work"
    label_singular: "Work 글"
    folder: _posts/work
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    preview_path: "work/{{year}}/{{month}}/{{day}}/{{fields.slug}}"
    summary: "{{title}} · {{workType}} ({{date}})"
    sort_field: date
    sort_direction: Descending
    fields:
      - label: "제목"
        name: title
        widget: string
      - label: "날짜"
        name: date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: "{{now}}"
      - label: "수정일"
        name: updatedAt
        widget: datetime
        default: "{{now}}"
      - label: "Slug"
        name: slug
        widget: string
        hint: "영문 소문자와 하이픈만 사용 (예: my-work-post)"
        pattern: ['^[a-z0-9-]+$', "영문 소문자, 숫자, 하이픈만 허용"]
      - label: "카테고리"
        name: category
        widget: hidden
        default: work
      - label: "Work 분류"
        name: workType
        widget: select
        required: true
        options:
          - { label: "Q&A", value: "qna" }
          - { label: "Article", value: "article" }
          - { label: "Coach", value: "coach" }
      - label: "내용"
        name: body
        widget: markdown

  - name: log
    label: "Log"
    label_singular: "Log 글"
    folder: _posts/log
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    preview_path: "log/{{year}}/{{month}}/{{day}}/{{fields.slug}}"
    summary: "{{title}} ({{date}})"
    sort_field: date
    sort_direction: Descending
    fields:
      - label: "제목"
        name: title
        widget: string
      - label: "날짜"
        name: date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: "{{now}}"
      - label: "수정일"
        name: updatedAt
        widget: datetime
        default: "{{now}}"
      - label: "Slug"
        name: slug
        widget: string
        hint: "영문 소문자와 하이픈만 사용 (예: my-log-note)"
        pattern: ['^[a-z0-9-]+$', "영문 소문자, 숫자, 하이픈만 허용"]
      - label: "카테고리"
        name: category
        widget: hidden
        default: log
      - label: "내용"
        name: body
        widget: markdown
