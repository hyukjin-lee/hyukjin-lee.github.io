<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Terrace CMS</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      max-width: 360px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    p { color: #666; margin-bottom: 24px; font-size: 0.9rem; }
    a.btn {
      display: inline-block;
      background: #24292e;
      color: white;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
    a.btn:hover { background: #444; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Terrace CMS</h1>
    <p>Pages CMS에서 GitHub 로그인 후<br>이 저장소를 선택하세요.</p>
    <a class="btn" href="https://app.pagescms.org">열기</a>
  </div>
</body>
</html>
